name: APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Testler
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # Surum numarasi = Actions calisma numarasi. Her push'ta kendiliginden artar,
      # uygulama da "benim surumumden buyuk mu" diye buna bakar.
      - name: APK derle
        run: >
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ github.run_number }}.0

      - name: APK'lari yukle
        uses: actions/upload-artifact@v4
        with:
          name: pofu-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Telefondaki uygulama guncellemeyi buradan cekiyor.
      - name: Release yayinla
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "pofu-${{ github.run_number }}.apk"
          gh release create "v${{ github.run_number }}" \
            "pofu-${{ github.run_number }}.apk" \
            --title "v${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B)"
